on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '51 3 * * Fri'

name: R-CMD-check

defaults:
  run:
    shell: Rscript {0}

jobs:
  R-CMD-check:
    name: ${{ matrix.os }}, py-${{ matrix.python }}, R-${{ matrix.r }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:

          ## the happy path - default everything
          - {os: 'ubuntu-latest' , python: '3.13', r: 'release'}
          - {os: 'windows-latest', python: '3.13', r: 'release'}
          - {os: 'macOS-latest'  , python: '3.13', r: 'release'}

          ## different python versions
          - {os: 'ubuntu-latest' , python: '3.12', r: 'release'}
          - {os: 'ubuntu-latest' , python: '3.11', r: 'release'}

          ## older R versions
          - {os: 'ubuntu-latest' , python: '3.11', r: 'oldrel-1'}
          - {os: 'ubuntu-latest' , python: '3.11', r: 'oldrel-2'}
          - {os: 'ubuntu-latest' , python: '3.11', r: 'oldrel-3'}

    runs-on: ${{ matrix.os }}
    env:
      R_KEEP_PKG_SOURCE: yes
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RETICULATE_PYTHON: managed

    steps:

      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
          Ncpus: '2L'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, local::.
          cache-version: 1
          upgrade: 'TRUE'

      - name: Install Keras
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          options(echo = TRUE)
          print(sessionInfo())
          reticulate::py_require(python_version = paste0("==", Sys.getenv("PYTHON_VERSION"), ".*"))
          print(keras3::op_convert_to_tensor("Hello World!"))
          config <- reticulate::py_config()
          print(config)
          cat("RETICULATE_PYTHON=", config$python, "\n",
              sep = "", file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
